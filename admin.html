<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Editor 💜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#1a0a2e;
  --card:#2d1458;
  --card2:#3b1872;
  --border:#5b21b6;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --fg:#ede9fe;
  --fg2:#c4b5fd;
  --fg3:#7c3aed;
  --input-bg:#140824;
  --danger:#ef4444;
  --success:#22c55e;
  --radius:12px;
  --ff:'Nunito',system-ui,sans-serif;
  --ff-hand:'Caveat',cursive;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--ff);
  background:var(--bg);color:var(--fg);
  min-height:100vh;
  padding:0;
  overflow-x:hidden;
}
img{max-width:100%}

/* ── LOGIN ── */
#loginScreen{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at 50% 0%,#3b1872 0%,#1a0a2e 70%);
}
.login-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;padding:40px 32px;
  width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;
}
.login-icon{font-size:52px;margin-bottom:16px}
.login-title{
  font-family:var(--ff-hand);font-size:2rem;font-weight:700;
  color:var(--accent2);margin-bottom:8px;
}
.login-sub{font-size:.9rem;color:var(--fg2);margin-bottom:28px}
.login-box input{
  width:100%;padding:13px 16px;
  background:var(--input-bg);border:2px solid var(--border);
  border-radius:10px;color:var(--fg);font-family:var(--ff);font-size:1rem;
  margin-bottom:14px;outline:none;
  transition:border-color .2s;
}
.login-box input:focus{border-color:var(--accent)}
.btn-login{
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--fg3),var(--accent));
  color:#fff;border:none;border-radius:10px;
  font-family:var(--ff);font-size:1rem;font-weight:800;
  cursor:pointer;transition:opacity .2s,transform .2s;
}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.login-err{color:#f87171;font-size:.85rem;margin-top:10px;min-height:20px}

/* ── ADMIN SHELL ── */
#adminShell{display:none}

.top-bar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px max(20px,env(safe-area-inset-left,20px));
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:100;
}
.top-bar-title{
  font-family:var(--ff-hand);font-size:1.5rem;font-weight:700;color:var(--accent2);
}
.bar-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{
  padding:9px 18px;border-radius:8px;border:none;
  font-family:var(--ff);font-size:.88rem;font-weight:700;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;
  text-decoration:none;
}
.btn-save{background:var(--success);color:#fff}
.btn-save:hover{background:#16a34a}
.btn-preview{background:var(--card2);color:var(--fg2);border:1px solid var(--border)}
.btn-preview:hover{background:var(--border);color:#fff}
.btn-logout{background:transparent;color:var(--fg2);border:1px solid var(--border)}
.btn-logout:hover{color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--danger);color:#fff}
.btn-add{background:var(--card2);color:var(--accent2);border:1px solid var(--border)}
.btn-add:hover{background:var(--border)}

/* toast */
.toast{
  position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--success);color:#fff;
  padding:12px 24px;border-radius:50px;
  font-weight:700;font-size:.9rem;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  z-index:999;transition:transform .3s;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── CONTENT ── */
.content{
  max-width:860px;margin:0 auto;
  padding:28px max(20px,env(safe-area-inset-left,20px)) 80px;
  display:flex;flex-direction:column;gap:28px;
}

/* ── SECTION CARD ── */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.card-head{
  padding:14px 20px;
  background:var(--card2);
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.card-head h2{font-size:1rem;font-weight:800;color:var(--accent2)}
.card-head .icon{font-size:1.1rem}
.card-body{padding:20px}

/* ── FIELD ── */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;font-size:.8rem;font-weight:700;
  color:var(--fg2);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase;
}
.field input[type=text],
.field textarea,
.field input[type=password]{
  width:100%;padding:11px 14px;
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:8px;color:var(--fg);font-family:var(--ff);font-size:.95rem;
  outline:none;transition:border-color .2s;resize:vertical;
}
.field input[type=text]:focus,
.field textarea:focus,
.field input[type=password]:focus{border-color:var(--accent)}

/* ── PHOTOS ── */
.photos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:16px;
}
.photo-slot{
  background:var(--input-bg);border:2px dashed var(--border);
  border-radius:10px;overflow:hidden;position:relative;
  aspect-ratio:1;cursor:pointer;
  transition:border-color .2s;
}
.photo-slot:hover{border-color:var(--accent)}
.photo-slot img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.photo-slot .ph-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--fg2);pointer-events:none;
}
.photo-slot .ph-overlay svg{width:32px;height:32px;opacity:.5}
.photo-slot .ph-overlay span{font-size:.8rem;opacity:.7}
.photo-slot .ph-remove{
  position:absolute;top:6px;right:6px;
  background:var(--danger);color:#fff;border:none;border-radius:50%;
  width:24px;height:24px;cursor:pointer;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.photo-slot:hover .ph-remove{opacity:1}
.photo-slot input[type=file]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
}

/* caption inputs below each photo */
.photo-caption-input{
  margin-top:6px;
  width:100%;padding:7px 10px;
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:6px;color:var(--fg);font-family:var(--ff);font-size:.82rem;
  outline:none;text-align:center;
}
.photo-caption-input:focus{border-color:var(--accent)}

/* ── MESSAGES ── */
.msg-list{display:flex;flex-direction:column;gap:12px}
.msg-row{
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:8px;padding:14px;
  display:grid;grid-template-columns:1fr 110px 80px auto;
  gap:10px;align-items:center;
}
@media(max-width:600px){
  .msg-row{grid-template-columns:1fr;gap:8px}
}
.msg-row textarea{
  background:transparent;border:none;color:var(--fg);
  font-family:var(--ff);font-size:.9rem;resize:none;
  outline:none;min-height:48px;
}
.msg-row select{
  background:var(--card2);border:1.5px solid var(--border);
  border-radius:6px;color:var(--fg2);font-family:var(--ff);font-size:.82rem;
  padding:7px 8px;outline:none;cursor:pointer;
}
.msg-row .side-select{
  background:var(--card2);border:1.5px solid var(--border);
  border-radius:6px;color:var(--fg2);font-family:var(--ff);font-size:.82rem;
  padding:7px 8px;outline:none;cursor:pointer;
}
.btn-rm{
  background:transparent;border:1px solid var(--danger);color:var(--danger);
  border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.8rem;font-family:var(--ff);
  transition:all .2s;
}
.btn-rm:hover{background:var(--danger);color:#fff}

/* ── MEMORIES ── */
.mem-list{display:flex;flex-direction:column;gap:10px}
.mem-row{display:flex;gap:10px;align-items:flex-start}
.mem-row textarea{
  flex:1;padding:11px 14px;
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:8px;color:var(--fg);font-family:var(--ff);font-size:.9rem;
  resize:vertical;outline:none;min-height:60px;
  transition:border-color .2s;
}
.mem-row textarea:focus{border-color:var(--accent)}

/* ── PASSWORD ── */
.pw-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pw-row .field{flex:1;min-width:200px;margin-bottom:0}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-icon">💜</div>
    <div class="login-title">Birthday Editor</div>
    <div class="login-sub">Enter password to edit the page</div>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password">
    <button class="btn-login" onclick="doLogin()">Unlock ✨</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ══ ADMIN SHELL ══ -->
<div id="adminShell">
  <div class="top-bar">
    <div class="top-bar-title">🎂 Birthday Editor</div>
    <div class="bar-actions">
      <button class="btn btn-save" onclick="saveAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        Save All
      </button>
      <a href="index.html" target="_blank" class="btn btn-preview">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        Preview
      </a>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="content">

    <!-- ── BASIC INFO ── -->
    <div class="card">
      <div class="card-head"><span class="icon">✏️</span><h2>Basic Info</h2></div>
      <div class="card-body">
        <div class="field">
          <label>Her Name</label>
          <input type="text" id="f_name" placeholder="e.g. Salmana">
        </div>
        <div class="field">
          <label>Subtitle (below the name)</label>
          <input type="text" id="f_subtitle" placeholder="e.g. Every day with you is a celebration ✨">
        </div>
        <div class="field">
          <label>Main Banner Text</label>
          <input type="text" id="f_banner" placeholder="e.g. These Memories Make Me Smile">
        </div>
      </div>
    </div>

    <!-- ── PHOTOS ── -->
    <div class="card">
      <div class="card-head"><span class="icon">📸</span><h2>Photos (up to 4)</h2></div>
      <div class="card-body">
        <div class="photos-grid" id="photosGrid"></div>
      </div>
    </div>

    <!-- ── MESSAGES / STICKY NOTES ── -->
    <div class="card">
      <div class="card-head">
        <span class="icon">📝</span><h2>Sticky Notes</h2>
        <button class="btn btn-add btn-sm" style="margin-left:auto" onclick="addMessage()">+ Add Note</button>
      </div>
      <div class="card-body">
        <div class="msg-list" id="msgList"></div>
      </div>
    </div>

    <!-- ── MEMORIES ── -->
    <div class="card">
      <div class="card-head">
        <span class="icon">💌</span><h2>Memories</h2>
        <button class="btn btn-add btn-sm" style="margin-left:auto" onclick="addMemory()">+ Add Memory</button>
      </div>
      <div class="card-body">
        <div class="mem-list" id="memList"></div>
      </div>
    </div>

    <!-- ── CHANGE PASSWORD ── -->
    <div class="card">
      <div class="card-head"><span class="icon">🔒</span><h2>Change Password</h2></div>
      <div class="card-body">
        <div class="pw-row">
          <div class="field">
            <label>New Password</label>
            <input type="password" id="f_newpw" placeholder="New password">
          </div>
          <div class="field">
            <label>Confirm</label>
            <input type="password" id="f_newpw2" placeholder="Confirm">
          </div>
          <button class="btn btn-save" onclick="changePassword()">Update</button>
        </div>
        <div id="pwMsg" style="font-size:.85rem;margin-top:10px;min-height:16px"></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /adminShell -->

<div class="toast" id="toast">✅ Saved!</div>

<script>
/* ── STORAGE ── */
const DEFAULT_PW = 'birthday';
function ls(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('Storage full! Try removing some photos.')}}
function getPw(){return ls('bd_admin_pw')||DEFAULT_PW}

const DEFAULTS={
  name:'Salmana',
  subtitle:'Every day with you is a celebration ✨',
  banner:'These Memories Make Me Smile',
  photos:['','','',''],
  captions:['Us 💜','Always ✦','Forever 🌸','My love ♥'],
  messages:[
    {text:'You are\nso loved 💜',         style:'s-purple', side:'left'},
    {text:'A little reminder: the world is brighter because you\'re in it. Keep shining always! ✨',style:'s-white',side:'left'},
    {text:'Good vibes only',               style:'badge',   side:'right'},
    {text:'Thankful for you every day 🌸', style:'s-pale',  side:'right'},
    {text:'So lucky to have you 🍀',       style:'s-mini',  side:'left'},
    {text:'Save this for your bestie\'s birthday too 😄',style:'s-mid',side:'right'},
  ],
  memories:[
    'The first time I saw you smile, I knew you were the one...',
    'All the adventures we\'ve been on together — each one better than the last...',
    'The way you make everything better just by being there with me...',
    'Looking forward to a lifetime more of memories with you, my love...',
  ],
};
function get(k){return ls('bd_'+k)??DEFAULTS[k]}

/* ── LOGIN ── */
function doLogin(){
  const val = document.getElementById('pwInput').value;
  if(val===getPw()){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminShell').style.display='block';
    loadAll();
  } else {
    document.getElementById('loginErr').textContent='Wrong password. Try again.';
  }
}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function logout(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('adminShell').style.display='none';
  document.getElementById('pwInput').value='';
}

/* ── LOAD ── */
let photosData=[]; // array of base64 or ''
let captionsData=[];

function loadAll(){
  document.getElementById('f_name').value      = get('name');
  document.getElementById('f_subtitle').value  = get('subtitle');
  document.getElementById('f_banner').value    = get('banner');

  photosData   = [...get('photos')];
  captionsData = [...get('captions')];
  renderPhotosGrid();
  renderMessages();
  renderMemories();
}

/* ── PHOTOS ── */
function renderPhotosGrid(){
  const grid = document.getElementById('photosGrid');
  grid.innerHTML = '';
  for(let i=0;i<4;i++){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="photo-slot" id="slot${i}" onclick="triggerUpload(${i})">
        ${photosData[i]
          ? `<img src="${photosData[i]}" alt="Photo ${i+1}">
             <button class="ph-remove" onclick="removePhoto(event,${i})">✕</button>`
          : `<div class="ph-overlay">
               <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
               <span>Add photo</span>
             </div>
             <input type="file" accept="image/*" onchange="uploadPhoto(event,${i})">`}
      </div>
      <input class="photo-caption-input" id="cap${i}" value="${captionsData[i]||''}" placeholder="Caption...">
    `;
    grid.appendChild(wrap);
  }
}

function triggerUpload(i){
  if(photosData[i]) return; // already has photo
  const slot=document.getElementById('slot'+i);
  const inp=slot.querySelector('input[type=file]');
  if(inp) inp.click();
}

async function uploadPhoto(e,i){
  const file=e.target.files[0];
  if(!file) return;
  const compressed = await compressImage(file,900,.85);
  photosData[i]=compressed;
  renderPhotosGrid();
}

function removePhoto(e,i){
  e.stopPropagation();
  photosData[i]='';
  renderPhotosGrid();
}

function compressImage(file,maxPx,quality){
  return new Promise(resolve=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){
        const s=maxPx/Math.max(w,h);
        w=Math.round(w*s);h=Math.round(h*s);
      }
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.src=url;
  });
}

/* ── MESSAGES ── */
const STYLES=[
  {val:'s-purple',label:'Purple note'},
  {val:'s-white', label:'White note'},
  {val:'s-accent',label:'Violet note'},
  {val:'s-pale',  label:'Pale note'},
  {val:'s-mid',   label:'Lavender note'},
  {val:'s-mini',  label:'Yellow note'},
  {val:'badge',   label:'Good vibes badge'},
];

let msgsData=[];
function renderMessages(){
  msgsData=[...get('messages')];
  _buildMsgList();
}
function _buildMsgList(){
  const list=document.getElementById('msgList');
  list.innerHTML='';
  msgsData.forEach((m,i)=>{
    const row=document.createElement('div');
    row.className='msg-row';
    row.innerHTML=`
      <textarea rows="2" oninput="msgsData[${i}].text=this.value">${m.text||''}</textarea>
      <select onchange="msgsData[${i}].style=this.value">
        ${STYLES.map(s=>`<option value="${s.val}"${m.style===s.val?' selected':''}>${s.label}</option>`).join('')}
      </select>
      <select class="side-select" onchange="msgsData[${i}].side=this.value">
        <option value="left"${m.side==='left'?' selected':''}>Left</option>
        <option value="right"${m.side==='right'?' selected':''}>Right</option>
      </select>
      <button class="btn-rm" onclick="removeMsg(${i})">✕</button>
    `;
    list.appendChild(row);
  });
}
function addMessage(){
  msgsData.push({text:'New note ✨',style:'s-purple',side:'left'});
  _buildMsgList();
}
function removeMsg(i){
  msgsData.splice(i,1);
  _buildMsgList();
}

/* ── MEMORIES ── */
let memsData=[];
function renderMemories(){
  memsData=[...get('memories')];
  _buildMemList();
}
function _buildMemList(){
  const list=document.getElementById('memList');
  list.innerHTML='';
  memsData.forEach((m,i)=>{
    const row=document.createElement('div');
    row.className='mem-row';
    row.innerHTML=`
      <textarea rows="2" oninput="memsData[${i}]=this.value">${m||''}</textarea>
      <button class="btn-rm" onclick="removeMem(${i})">✕</button>
    `;
    list.appendChild(row);
  });
}
function addMemory(){
  memsData.push('A beautiful memory...');
  _buildMemList();
}
function removeMem(i){
  memsData.splice(i,1);
  _buildMemList();
}

/* ── SAVE ALL ── */
function saveAll(){
  // read captions from inputs
  for(let i=0;i<4;i++){
    const c=document.getElementById('cap'+i);
    if(c) captionsData[i]=c.value;
  }
  lsSet('bd_name',       document.getElementById('f_name').value||'Salmana');
  lsSet('bd_subtitle',   document.getElementById('f_subtitle').value);
  lsSet('bd_banner',     document.getElementById('f_banner').value);
  lsSet('bd_photos',     photosData);
  lsSet('bd_captions',   captionsData);
  lsSet('bd_messages',   msgsData);
  lsSet('bd_memories',   memsData);
  showToast('✅ Saved! Open Preview to see changes.');
}

/* ── CHANGE PASSWORD ── */
function changePassword(){
  const a=document.getElementById('f_newpw').value;
  const b=document.getElementById('f_newpw2').value;
  const msg=document.getElementById('pwMsg');
  if(!a){msg.style.color='#f87171';msg.textContent='Enter a new password.';return}
  if(a!==b){msg.style.color='#f87171';msg.textContent="Passwords don't match!";return}
  lsSet('bd_admin_pw',a);
  msg.style.color='#4ade80';msg.textContent='Password updated!';
  document.getElementById('f_newpw').value='';
  document.getElementById('f_newpw2').value='';
  setTimeout(()=>msg.textContent='',3000);
}

/* ── TOAST ── */
function showToast(msg='Saved!'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
